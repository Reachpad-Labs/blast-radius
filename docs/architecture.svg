<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230" font-family="Inter, -apple-system, system-ui, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#6b6b6b"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#F87171"/>
  </marker>
</defs>
<rect width="1440" height="1230" fill="#121212"/>

<text x="50" y="52" fill="#ECE7DE" font-size="26" font-weight="500">Blast Radius — two collectors, one schema</text>
<text x="50" y="80" fill="#8a8a8a" font-size="14">The same specimen, observed at two different boundaries. The disagreement between them is the finding.</text>

<!-- BAND 1 -->
<rect x="50" y="110" width="560" height="190" rx="10" fill="#1a1a1a" stroke="#2e2e2e"/>
<text x="70" y="141" fill="#34D399" font-size="12" font-weight="500" letter-spacing="1.2">1 · SPECIMEN</text>
<text x="70" y="170" fill="#ECE7DE" font-size="17" font-weight="500">Untrusted code, unmodified</text>
<text x="70" y="203" fill="#9a9a9a" font-size="13.5">• npm MCP server on Edge.js/QuickJS (Wasmer 7.2.1)</text>
<text x="70" y="229" fill="#9a9a9a" font-size="13.5">• agent-written script — the tool call about to be exec&#8217;d</text>
<text x="70" y="255" fill="#9a9a9a" font-size="13.5">• pure-Python MCP server or Claude Code skill via WASIX</text>
<text x="70" y="284" fill="#6b6b6b" font-size="12.5" font-style="italic">no source changes. no cooperation required.</text>

<rect x="660" y="110" width="730" height="190" rx="10" fill="#1a1a1a" stroke="#2e2e2e"/>
<text x="680" y="141" fill="#34D399" font-size="12" font-weight="500" letter-spacing="1.2">2 · CANARY WORLD</text>
<text x="680" y="170" fill="#ECE7DE" font-size="17" font-weight="500">The filesystem and env it thinks it has</text>
<text x="680" y="203" fill="#9a9a9a" font-size="13" font-family="ui-monospace, Menlo, monospace">~/.ssh/id_ed25519        →  CANARY-7f3a91</text>
<text x="680" y="229" fill="#9a9a9a" font-size="13" font-family="ui-monospace, Menlo, monospace">./.env  AWS_SECRET_KEY   →  CANARY-b2d004</text>
<text x="680" y="255" fill="#9a9a9a" font-size="13" font-family="ui-monospace, Menlo, monospace">env     GITHUB_TOKEN     →  CANARY-19ce77</text>
<text x="680" y="284" fill="#6b6b6b" font-size="12.5" font-style="italic">unique strings — a match is proof, not a heuristic. identical in both tiers.</text>

<path d="M330 300 L330 326 L1070 326 L1070 352" stroke="#6b6b6b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M370 326 L370 352" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M1025 300 L1025 326" stroke="#6b6b6b" stroke-width="1.5"/>

<!-- COLLECTOR A -->
<rect x="50" y="356" width="640" height="400" rx="10" fill="#171717" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="70" y="387" fill="#34D399" font-size="12" font-weight="500" letter-spacing="1.2">COLLECTOR 1 · WASI IMPORT SHIM</text>
<text x="70" y="415" fill="#ECE7DE" font-size="17" font-weight="500">You own the import table</text>
<text x="70" y="440" fill="#8a8a8a" font-size="13">Wasmer runs it. Every import is a JS function you wrote.</text>
<rect x="70" y="458" width="600" height="146" rx="8" fill="#1e1e1e" stroke="#2e2e2e"/>
<text x="90" y="486" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">path_open</text>
<text x="300" y="486" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">sock_connect</text>
<text x="500" y="486" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">fd_read</text>
<text x="90" y="512" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">fd_write</text>
<text x="300" y="512" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">sock_send</text>
<text x="500" y="512" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">proc_exec</text>
<text x="90" y="538" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">environ_get</text>
<text x="300" y="538" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">path_unlink</text>
<text x="500" y="538" fill="#6b6b6b" font-size="13" font-family="ui-monospace, Menlo, monospace">~30 more</text>
<circle cx="97" cy="573" r="5" fill="#34D399"/><text x="112" y="578" fill="#9a9a9a" font-size="12.5">ALLOW</text>
<circle cx="217" cy="573" r="5" fill="#F87171"/><text x="232" y="578" fill="#9a9a9a" font-size="12.5">DENY → EACCES</text>
<circle cx="410" cy="573" r="5" fill="#FBBF24"/><text x="425" y="578" fill="#9a9a9a" font-size="12.5">OBSERVE</text>
<text x="70" y="636" fill="#6EE7A8" font-size="13.5" font-weight="500">Can refuse and let it keep running.</text>
<text x="70" y="660" fill="#9a9a9a" font-size="13">Return EACCES, watch what it tries next. This is the mitigation demo.</text>
<text x="70" y="700" fill="#6b6b6b" font-size="12.5">Browser tab. No root, no VM, no provisioning.</text>
<text x="70" y="724" fill="#F87171" font-size="12.5">Blind to anything the runtime services internally.</text>

<!-- COLLECTOR B -->
<rect x="750" y="356" width="640" height="400" rx="10" fill="#171717" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="770" y="387" fill="#34D399" font-size="12" font-weight="500" letter-spacing="1.2">COLLECTOR 2 · eBPF — TIER 2 ONLY, SPECIMEN NOT IN WASM</text>
<text x="770" y="415" fill="#ECE7DE" font-size="17" font-weight="500">The kernel owns the boundary</text>
<text x="770" y="440" fill="#8a8a8a" font-size="13">Specimen is a real process. Tracepoints, not imports.</text>
<rect x="770" y="458" width="600" height="146" rx="8" fill="#1e1e1e" stroke="#2e2e2e"/>
<text x="790" y="486" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">sys_enter_openat</text>
<text x="1080" y="486" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">sys_enter_connect</text>
<text x="790" y="512" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">sched_process_exec</text>
<text x="1080" y="512" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">sys_enter_write</text>
<text x="790" y="538" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">sys_enter_unlinkat</text>
<text x="1080" y="538" fill="#ECE7DE" font-size="13" font-family="ui-monospace, Menlo, monospace">sys_enter_ptrace</text>
<text x="790" y="578" fill="#6b6b6b" font-size="12.5">bpftrace, ~4 probes. Sees native addons, forks, every child process.</text>
<text x="770" y="636" fill="#FBBF24" font-size="13.5" font-weight="500">Observe-only. The kernel does not ask permission.</text>
<text x="770" y="660" fill="#9a9a9a" font-size="13">You get ground truth, but you cannot say no mid-syscall.</text>
<text x="770" y="700" fill="#6b6b6b" font-size="12.5">Today: plain subprocess on this box. Prod: inside the Firecracker guest —</text>
<text x="770" y="724" fill="#F87171" font-size="12.5">needs a guest kernel with BTF. Do not try to rebuild that today.</text>

<path d="M370 756 L370 796" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M1070 756 L1070 796" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a)"/>

<!-- SCHEMA BAR -->
<rect x="50" y="800" width="1340" height="66" rx="10" fill="#1e2a24" stroke="#34D399"/>
<text x="70" y="828" fill="#6EE7A8" font-size="12" font-weight="500" letter-spacing="1.2">3 · ONE EVENT SCHEMA — THE KEYSTONE</text>
<text x="70" y="852" fill="#ECE7DE" font-size="13.5" font-family="ui-monospace, Menlo, monospace">{ ts, boundary, call, args, canary_hit, decision }   — a card cannot tell which collector produced it</text>

<path d="M370 866 L370 902" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M1070 866 L1070 902" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a)"/>

<!-- DIFFERENTIAL -->
<rect x="50" y="906" width="640" height="270" rx="10" fill="#1a1a1a" stroke="#2e2e2e" stroke-dasharray="6 5"/>
<text x="70" y="937" fill="#F87171" font-size="12" font-weight="500" letter-spacing="1.2">4 · DIFFERENTIAL — ESCAPE DETECTION · RESEARCH, NOT TODAY</text>
<text x="70" y="965" fill="#ECE7DE" font-size="17" font-weight="500">Same specimen, both collectors, subtract</text>
<text x="70" y="1002" fill="#8a8a8a" font-size="12.5" font-family="ui-monospace, Menlo, monospace">tier1  WASI    3 opens   1 host    0 exec</text>
<text x="70" y="1027" fill="#8a8a8a" font-size="12.5" font-family="ui-monospace, Menlo, monospace">tier2  eBPF    4 opens   2 hosts   1 exec</text>
<text x="70" y="1046" fill="#3a3a3a" font-size="12.5" font-family="ui-monospace, Menlo, monospace">──────────────────────────────────────────</text>
<text x="70" y="1072" fill="#F87171" font-size="12.5" font-family="ui-monospace, Menlo, monospace">Δ              +1 open  +1 host   +1 exec  ⚑</text>
<text x="70" y="1112" fill="#ECE7DE" font-size="13">A delta means the runtime did something no shim call accounts for.</text>
<text x="70" y="1136" fill="#6b6b6b" font-size="12.5">Only fires on a real Wasmer/Edge.js escape. Not findable in an afternoon.</text>

<!-- VERDICT -->
<rect x="750" y="906" width="640" height="270" rx="10" fill="#1a1a1a" stroke="#2e2e2e"/>
<text x="770" y="937" fill="#34D399" font-size="12" font-weight="500" letter-spacing="1.2">5 · VERDICT CARD</text>
<text x="770" y="965" fill="#ECE7DE" font-size="17" font-weight="500">What running this would have cost you</text>
<circle cx="777" cy="1000" r="5" fill="#F87171"/><text x="794" y="1005" fill="#ECE7DE" font-size="13.5">READS CREDENTIALS</text><text x="1090" y="1005" fill="#9a9a9a" font-size="12.5" font-family="ui-monospace, Menlo, monospace">~/.ssh/id_ed25519</text>
<circle cx="777" cy="1035" r="5" fill="#F87171"/><text x="794" y="1040" fill="#ECE7DE" font-size="13.5">ATTEMPTS EGRESS</text><text x="1090" y="1040" fill="#9a9a9a" font-size="12.5" font-family="ui-monospace, Menlo, monospace">2 hosts · 1 blocked</text>
<circle cx="777" cy="1070" r="5" fill="#FBBF24"/><text x="794" y="1075" fill="#ECE7DE" font-size="13.5">CANARY IN PAYLOAD</text><text x="1090" y="1075" fill="#9a9a9a" font-size="12.5" font-family="ui-monospace, Menlo, monospace">CANARY-7f3a91</text>
<circle cx="777" cy="1105" r="5" fill="#F87171"/><text x="794" y="1110" fill="#ECE7DE" font-size="13.5">EVADES TIER 1</text><text x="1090" y="1110" fill="#9a9a9a" font-size="12.5" font-family="ui-monospace, Menlo, monospace">1 exec unseen</text>
<text x="770" y="1150" fill="#6b6b6b" font-size="12.5">Renders live in a browser. Ships as a Reachpad app — demo video is a live URL.</text>

<text x="50" y="1207" fill="#6b6b6b" font-size="12.5">TODAY: Collector 1 only. A WASM module has no syscall instruction — the shim sees everything, and eBPF would see a redundant shadow or nothing at all. Collector 2 is what tier 2 needs when there is no import table to own.</text>
</svg>
