<style>/* Blast Radius Sweep — a Mac-style browser over the saved cards.

:root{

}
:root[data-theme="dark"]{

  --grid:rgba(235,235,245,.12); --tip-bg:#2C2C2E; --tip-shadow:0 8px 24px rgba(0,0,0,.5);

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:.93em}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.caption{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}

/* app frame */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--sidebar);border-right:1px solid var(--sep);position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px 24px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 0}
.brand .mark{width:22px;height:22px;border-radius:6px;background:var(--red);display:grid;place-items:center;flex:none}
.brand .mark svg{width:14px;height:14px;fill:#fff}
.brand b{font-size:15px;font-weight:600}
.brand span{display:block;font-size:11px;color:var(--ink2)}
.search{position:relative}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;fill:var(--ink3)}
.search input{width:100%;border:0;background:var(--fill);border-radius:8px;padding:6px 10px 6px 28px;font:inherit;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0}
.group{display:flex;flex-direction:column;gap:1px}
.group h3{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:10px 8px 4px}
.row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 8px;border-radius:7px;line-height:1.25}
.row:hover{background:var(--fill)}
.row[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
.row[aria-current="true"] .sub,.row[aria-current="true"] .sym{color:var(--on-accent)}
.row .sym{width:16px;height:16px;flex:none}
.row .sym svg{width:16px;height:16px;fill:currentColor}
.row .t{min-width:0;flex:1;display:flex;flex-direction:column}
.row .name{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:block;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .count{font-size:11px;color:var(--ink2);background:var(--fill);border-radius:9px;padding:1px 7px;flex:none}
.row[aria-current="true"] .count{background:rgba(255,255,255,.22);color:var(--on-accent)}
.sym.critical{color:var(--red)} .sym.warn,.sym.undeclared{color:var(--orange)} .sym.clean,.sym.expected{color:var(--green)} .sym.noboot{color:var(--gray)} .sym.control{color:var(--red)} .sym.overview{color:var(--accent)}
.empty{padding:10px 8px;font-size:12px;color:var(--ink3)}

.content{padding:28px 36px 72px;max-width:1120px;width:100%;min-width:0}
.back{display:none;align-items:center;gap:4px;color:var(--accent);font-size:15px;margin-bottom:14px}
.back svg{width:12px;height:12px;fill:currentColor}

/* header */
.hdr{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.hdr .eyebrow{font-size:12px;color:var(--ink2)}
.hdr h1{font-size:24px;line-height:1.2;word-break:break-word}
.hdr .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.hdr .meta code{background:var(--code-bg);padding:1px 6px;border-radius:5px}

/* segmented control (network policy) */
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:-6px 0 10px}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.policy-line{font-size:12.5px;color:var(--ink2);margin:0 0 14px;line-height:1.5}
.policy-line code{background:var(--code-bg);padding:1px 6px;border-radius:5px}

/* verdict banner */
.verdict{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:22px}
.verdict.critical{background:var(--red-bg)} .verdict.warn,.verdict.undeclared{background:var(--orange-bg)} .verdict.clean,.verdict.expected{background:var(--green-bg)} .verdict.noboot{background:var(--gray-bg)}
.verdict svg{width:22px;height:22px;flex:none;margin-top:1px}
.verdict.critical svg{fill:var(--red)} .verdict.warn svg,.verdict.undeclared svg{fill:var(--orange)} .verdict.clean svg,.verdict.expected svg{fill:var(--green)} .verdict.noboot svg{fill:var(--gray)}
.verdict .lvl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.verdict.critical .lvl{color:var(--red)} .verdict.warn .lvl,.verdict.undeclared .lvl{color:var(--orange)} .verdict.clean .lvl,.verdict.expected .lvl{color:var(--green)} .verdict.noboot .lvl{color:var(--ink2)}
.verdict .line{font-size:16px;font-weight:500;margin-top:1px}
.verdict .why{font-size:13px;color:var(--ink2);margin-top:4px}

/* sections (inset grouped) */
.sec{margin-bottom:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px 6px}
.sec-h h2{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.tier{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.tier.sink{color:var(--accent)}
.box{background:var(--cell);border-radius:12px;overflow:hidden}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:0}
.kv>div{padding:10px 14px;border-bottom:1px solid var(--sep);min-width:0}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv .k{color:var(--ink2);font-size:13px}
.kv .v{font-size:13px;word-break:break-word}
.kv .v code{background:var(--code-bg);padding:1px 6px;border-radius:5px}
.none{color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.pill svg{width:11px;height:11px;fill:currentColor}
.pill.blocked{background:var(--green-bg);color:var(--green)}
.pill.allowed{background:var(--red-bg);color:var(--red)}
.pill.sink{background:var(--accent-bg);color:var(--accent)}
.pill.count{background:var(--fill);color:var(--ink2)}
.pill.vendor,.pill.asked{background:var(--fill);color:var(--ink2)}
.pill.undeclared,.pill.unprompted{background:var(--orange-bg);color:var(--orange)}
.dot em{font-style:normal;color:var(--orange);font-weight:600;font-size:10px;margin-left:2px}
.hosts{display:flex;flex-direction:column;gap:6px}
.hosts>div{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.chip{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;background:var(--fill);color:var(--ink);padding:3px 8px;border-radius:6px}
.foot{font-size:12px;color:var(--ink2);padding:8px 4px 0;line-height:1.5}

/* timeline */
.tl{padding:14px 14px 6px;overflow-x:auto}
.tl svg{display:block;width:100%;height:auto;min-width:620px}
.tl .lane-label{font-size:11px;fill:var(--ink2)}
.tl .lane-none{font-size:11px;fill:var(--ink3)}
.tl .tick{font-size:10px;fill:var(--ink3)}
.tl .gridline{stroke:var(--grid);stroke-width:1}
.tl .lane-line{stroke:var(--sep);stroke-width:1;stroke-dasharray:1 3}
.tl .m{cursor:default}
.tl .m.cred{fill:var(--red);stroke:var(--red)} .tl .m.file{fill:var(--gray);stroke:var(--gray)} .tl .m.env{fill:var(--gray);stroke:var(--gray)}
.tl .m.write{fill:var(--orange);stroke:var(--orange)} .tl .m.dns,.tl .m.connect,.tl .m.send{fill:var(--accent);stroke:var(--accent)}
.tl .m.deny{fill:var(--cell)!important;stroke-width:1.8}
.tl .slash{stroke:currentColor;stroke-width:1.6;pointer-events:none}
.tl .slash.cred{stroke:var(--red)} .tl .slash.dns,.tl .slash.connect,.tl .slash.send{stroke:var(--accent)} .tl .slash.write{stroke:var(--orange)} .tl .slash.file{stroke:var(--gray)}
.tl .badge{font-size:9.5px;font-weight:600;fill:var(--ink2)}
.tl .hit{fill:transparent;cursor:default}
.tl rect.m{stroke-width:0} .tl rect.m.deny{stroke-width:1.8}

.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.8px solid currentColor}
.legend i.f{background:currentColor}

.tile .l small{display:block;color:var(--ink3);font-size:11px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--cell);text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);padding:8px 8px;border-bottom:1px solid var(--sep);white-space:nowrap}
th button{display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
th button svg{width:9px;height:9px;fill:var(--ink3)}
th[aria-sort="ascending"] button svg,th[aria-sort="descending"] button svg{fill:var(--accent)}
td{padding:8px 8px;border-bottom:1px solid var(--sep);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--cell-hover)}
tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
td .name{font-weight:500;overflow-wrap:anywhere}
th:first-child,td:first-child{min-width:190px}
td .ver{font-size:11.5px;color:var(--ink2)}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.vd{display:inline-flex;align-items:center;gap:5px;font-weight:500;white-space:nowrap}
.vd svg{width:14px;height:14px}
.vd.critical{color:var(--red)} .vd.critical svg{fill:var(--red)} .vd.warn,.vd.undeclared{color:var(--orange)} .vd.warn svg,.vd.undeclared svg{fill:var(--orange)} .vd.clean,.vd.expected{color:var(--green)} .vd.clean svg,.vd.expected svg{fill:var(--green)} .vd.noboot{color:var(--ink2)} .vd.noboot svg{fill:var(--gray)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{display:inline-flex;align-items:center;gap:4px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;background:var(--fill);padding:2px 7px;border-radius:5px;white-space:nowrap}
.dot i{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.blocked i{background:var(--green)} .dot.allowed i{background:var(--red)}
.hostmap>div{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--sep);align-items:start}
.hostmap>div:last-child{border-bottom:0}
.hostmap .h{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;word-break:break-all}
.hostmap .h small{display:block;font-family:inherit;color:var(--ink2);font-size:11px}
.hostmap .who{display:flex;flex-wrap:wrap;gap:5px}
.hostmap .who button{font-size:12px;background:var(--fill);padding:2px 8px;border-radius:6px;color:var(--ink)}
.hostmap .who button:hover{background:var(--cell-hover)}
.about{font-size:13px;color:var(--ink2);line-height:1.55;max-width:66ch}
.about p{margin:0 0 8px}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--sep)}
  .content{padding:18px 16px 56px}
  body.detail .sidebar{display:none}
  body.detail .back{display:inline-flex}
  .kv{grid-template-columns:1fr}
  .kv>div{border-bottom:0;padding:6px 14px}
  .kv .k{padding-top:10px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .kv .v{padding-bottom:10px;border-bottom:1px solid var(--sep)}
  .kv>div:nth-last-child(1){border-bottom:0}
  .hostmap>div{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .row,.pill,.tile{transition:background-color .12s ease}
}

      '<p><b>Received by our collector.</b> The one row that can say a secret actually left. Every run plants a unique fake secret in the sandbox’s home folder. For our deliberately malicious server we let it connect to a collector we control; the fake secret showed up in what arrived, so that leak is proven. Every other server was blocked from connecting, so their row reads “not observed” by design. The sandbox never sees the contents of a message, so nothing else on these pages claims to know what a server would have sent.</p>' +
      '<p><b>Three verdicts, all descriptive.</b> <b>Expected</b> means it only did what its job or our request implied: reached its own vendor, opened a file we passed as an argument, connected to the database we gave it, or did nothing. <b>Undeclared</b> means it did something nobody asked for and nothing announced: a host outside its vendor’s domains, a secret file no argument pointed at, a change outside its own folder. <b>Critical</b> means a planted secret provably arrived at our collector, or was opened unprompted right before a connection attempt. “Its vendor” is read off the package name: api.exa.ai belongs to exa-mcp-server, api.hubspot.com to @hubspot/mcp-server.</p>' +
      '<p><b>One run, not a reputation.</b> Each tool was called once with made-up arguments. A verdict says what the server did here, not what it might do on your machine over months. Sandbox: ' + esc(DATA.engine) + '.</p>' +
      '</div></section>';
    return h;
  }

  /* ---------- detail ---------- */
  function kv(rows) {
    return '<div class="box"><div class="kv">' + rows.map(function (r) { return '<div class="k">' + r[0] + '</div><div class="v">' + r[1] + '</div>'; }).join('') + '</div></div>';
  }
  function renderDetail(s) {
    var run = runOf(s);
    var f = run ? run.findings : null;
    var view = run ? { level: run.level, findings: run.findings, bootReason: s.bootReason } : s;
    var events = run ? run.events : [];
    var h = '<button class="back" data-sel="overview">' + I.back + 'Servers</button>';
    h += '<div class="hdr"><span class="eyebrow">' + (s.control ? 'Our planted bad server, written to prove the tool catches a real leak' : 'npm package') + (s.note ? ' · ' + esc(s.note) : '') + '</span>' +
      '<h1>' + esc(s.name) + '</h1><div class="meta">' +
      '<span>version <code>' + esc(s.version) + '</code></span>' +
      (s.integrity ? '<span>file fingerprint <code title="' + esc(s.integrity) + '">' + esc(s.integrity.slice(0, 16)) + '…</code></span>' : '') +
      (s.tools.length ? '<span>' + plural(s.tools.length, 'tool') + ' offered</span>' : '') +
      (s.bootMs != null && s.booted ? '<span>started in ' + (s.bootMs / 1000).toFixed(1) + 's</span>' : '') +
      '</div></div>';
    if (s.runs && s.runs.length > 1) {
      h += '<div class="seg" role="tablist" aria-label="Network policy">' + s.runs.map(function (r) { return '<button role="tab" aria-selected="' + (r === run) + '" data-run="' + esc(r.mode) + '">' + esc(r.label) + '</button>'; }).join('') + '</div>';
    }
    if (run) h += '<p class="policy-line">' + esc(POLICY[run.mode] || '') + (run.mode === 'vendor' && run.net ? ' Allowed: <code>' + esc(run.net.replace(/dns:allow=/g, '').replace(/:\*/g, '')) + '</code>.' : '') + '</p>';
    var lvl = view.level;
    h += '<div class="verdict ' + lvl + '">' + verdictIcon(lvl) + '<div><div class="lvl">' + LV[lvl] + '</div><div class="line" title="' + esc(f ? f.verdict.line : '') + '">' + esc(f ? plainLine(f.verdict.line) : 'Never finished starting up.') + '</div><div class="why">' + esc(whyLine(view)) + (WHY[lvl] ? ' <span class="none">' + esc(LV[lvl]) + ' means ' + esc(WHY[lvl]) + '.</span>' : '') + '</div></div></div>';

    if (f) {
      h += '<section class="sec"><div class="sec-h"><h2>What it did, in order</h2><span class="tier">seen by the sandbox · ' + plural(events.length, 'action') + ', runtime noise removed</span></div><div class="box"><div class="tl">' + timeline(events) + '</div>' + legend() + logList(events) + '</div>' +
        '<p class="foot">Time runs left to right. We started the server, asked for its tool list, then called every tool once with made-up arguments. Hover a dot for details; the log underneath says the same thing in words.</p></section>';

      h += '<section class="sec"><div class="sec-h"><h2>Who it tried to reach</h2><span class="tier">seen by the sandbox, except the last row</span></div>' + kv([
        ['Servers contacted', f.egress.length ? '<div class="hosts">' + hostsOf(f).map(function (e) { return '<div><code>' + esc(e.host) + (e.ports.length ? ':' + e.ports.join(',') : '') + '</code>' + pillHost(e) + hostTag(e) + (e.ips.length ? '<span class="none">' + esc(e.ips.slice(0, 2).join(', ')) + (e.ips.length > 2 ? ' +' + (e.ips.length - 2) : '') + '</span>' : '') + '<span class="none num">at ' + e.at.toFixed(2) + 's</span></div>'; }).join('') + '</div>' : '<span class="none">none</span>'],
        ['Data sent', f.bytes_out ? '<b>' + f.bytes_out + ' bytes</b> over an open connection' : '<span class="none">none, no connection was allowed</span>'],
        ['Planted secret received <span class="tier sink">by our collector</span>', f.canary_in_payload.length ? f.canary_in_payload.map(function (c) { return '<code>' + esc(c) + '</code>'; }).join(' ') + ' <span class="pill sink">' + I.check + 'arrived at our collector</span>' : '<span class="none">not observed' + (f.egress.length && f.egress.every(function (e) { return e.blocked; }) ? ' — its connections were blocked, so nothing could arrive' : '') + '</span>']
      ]) + '</section>';

      h += '<section class="sec"><div class="sec-h"><h2>Files it touched</h2><span class="tier">seen by the sandbox</span></div>' + kv([
        ['Secret files opened', f.reads_credentials.length ? f.reads_credentials.map(function (r) { return '<div><code>' + esc(r.path) + '</code>' + (r.count > 1 ? ' <span class="pill count">×' + r.count + '</span>' : '') + (r.asked === true ? ' <span class="pill asked">our probe asked for it</span>' : r.asked === false ? ' <span class="pill unprompted">' + I.flag + 'unprompted</span>' : '') + (r.canary ? ' <span class="pill sink">planted secret</span>' : '') + '</div>'; }).join('') : '<span class="none">none</span>'],
        ['Files changed outside its own folder', f.writes_outside_cwd.length ? f.writes_outside_cwd.map(function (p) { return '<div><code>' + esc(p) + '</code></div>'; }).join('') : '<span class="none">none</span>'],
        ['Probing the runtime (engine, version)', f.fingerprinting.length ? f.fingerprinting.map(function (p) { return '<div><code>' + esc(p) + '</code></div>'; }).join('') : '<span class="none">none</span>']
      ]) + '</section>';
    }

    if (s.tools.length) {
      h += '<section class="sec"><div class="sec-h"><h2>Tools it offers</h2><span class="tier">' + s.tools.length + ' · each was called once</span></div><div class="box"><div class="chips">' + s.tools.map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div></div></section>';
    }
    if (!f) {
      h += '<section class="sec"><div class="sec-h"><h2>Why there is no verdict</h2></div>' + kv([
        ['What happened', esc(s.bootReason || 'It never finished starting up.')],
        ['Time to failure', s.bootMs != null ? (s.bootMs / 1000).toFixed(1) + 's' : '<span class="none">–</span>']
      ]) + '<p class="foot">A verdict on a server that never ran would be a false claim, so there is none.</p></section>';
    }
    h += '<section class="sec"><div class="sec-h"><h2>What exactly ran</h2></div>' + kv([
      ['Package', '<code>' + esc(s.pkg) + '</code>'],
      ['Version', '<code>' + esc(s.version) + '</code>'],
      ['File fingerprint (SHA-256)', s.integrity ? '<code>' + esc(s.integrity) + '</code>' : '<span class="none">–</span>'],
      ['Start file inside the sandbox', s.entry ? '<code>' + esc(s.entry) + '</code>' : '<span class="none">–</span>'],
      ['How “expected” was decided', f && f.policy ? '<div>vendor words from its name: ' + (f.policy.vendorTokens.length ? f.policy.vendorTokens.map(function (t) { return '<code>' + esc(t) + '</code>'; }).join(' ') : '<span class="none">none</span>') + '</div><div>hosts we passed in: ' + (f.policy.argHosts.length ? f.policy.argHosts.map(function (t) { return '<code>' + esc(t) + '</code>'; }).join(' ') : '<span class="none">none</span>') + '</div><div>paths our probe handed to its tools: ' + (f.policy.probePaths.length ? f.policy.probePaths.map(function (t) { return '<code>' + esc(t) + '</code>'; }).join(' ') : '<span class="none">none</span>') + '</div>' : '<span class="none">older card, no policy recorded</span>'],
      ['Sandbox', esc(DATA.engine)],
      ['Network policy', run ? esc(run.label) + (run.net ? ' · rule <code>' + esc(run.net) + '</code>' : ' · no rule, which refuses everything') : '<span class="none">–</span>'],
      ['When', esc(DATA.ran ? new Date(DATA.ran).toLocaleString() : '')]
    ]) + '</section>';
    return h;
  }

  /* ---------- routing / render ---------- */
  function render() {
    renderSidebar();
    var s = byslug[state.sel];
    $('#content').innerHTML = s ? renderDetail(s) : renderOverview();
    document.body.classList.toggle('detail', !!s);
    document.title = (s ? s.name + ' · ' : '') + 'Blast Radius Sweep';
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return { sel: state.sel, q: state.q }; });
  }
  function select(sel, push) {
    state.sel = byslug[sel] ? sel : 'overview';
    if (push !== false) { try { history.replaceState(null, '', state.sel === 'overview' ? '#overview' : '#s/' + state.sel); } catch (e) {} }
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  function fromHash() {
    var m = /^#s\/([^/]+)(?:\/([a-z]+))?$/.exec(location.hash || '');
    if (m && m[2]) state.run = m[2];
    return m ? decodeURIComponent(m[1]) : 'overview';
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-sel]');
    if (t) { select(t.getAttribute('data-sel')); return; }
    var rt = ev.target.closest('[data-run]');
    if (rt) { state.run = rt.getAttribute('data-run'); render(); try { history.replaceState(null, '', '#s/' + state.sel + '/' + state.run); } catch (e) {} return; }
    var st = ev.target.closest('[data-sort]');
    if (st) { var k = st.getAttribute('data-sort'); if (state.sortKey === k) state.sortDir = -state.sortDir; else { state.sortKey = k; state.sortDir = 1; } render(); }
  });
  document.addEventListener('keydown', function (ev) {
    var tr = ev.target.closest && ev.target.closest('tr[data-sel]');
    if (tr && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); select(tr.getAttribute('data-sel')); return; }
    if (ev.target.classList && ev.target.classList.contains('row') && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
      var rows = Array.prototype.slice.call(document.querySelectorAll('.sidebar .row'));
      var i = rows.indexOf(ev.target) + (ev.key === 'ArrowDown' ? 1 : -1);
      if (rows[i]) { ev.preventDefault(); rows[i].focus(); }
    }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'q') { state.q = ev.target.value; var pos = ev.target.selectionStart; renderSidebar(); var q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} }
  });
  window.addEventListener('hashchange', function () { select(fromHash(), false); });

  // tooltip
  var tip = $('#tip');
  function showTip(el, x, y) {
    var d; try { d = JSON.parse(el.getAttribute('data-tip')); } catch (e) { return; }
    var net = d.lane === 'Lookups (DNS)' || d.lane === 'Connections';
    var when = d.tEnd !== d.t ? d.t.toFixed(2) + 's to ' + d.tEnd.toFixed(2) + 's' : 'at ' + d.t.toFixed(2) + 's';
    var lines = (d.keys || []).map(function (k) {
      return '<code>' + esc(k.k) + '</code>' + (k.n > 1 ? ' ×' + k.n : '') +
        (k.deny ? ' <b style="display:inline;color:var(--green)">blocked' + (k.deny < k.n ? ', ' + k.deny + ' of ' + k.n : '') + '</b>' : (net ? ' · went through' : ''));
    });
    tip.innerHTML = '<b>' + esc(d.lane) + (d.n > 1 ? ' · ' + d.n + ' actions' : '') + '</b>' + lines.join('<br>') +
      '<br><span class="none">' + esc(when) + (d.bytes ? ' · ' + d.bytes + ' bytes' : '') + (d.errno && d.errno !== 'success' ? ' · ' + esc(d.errno) : '') + (d.from ? ' · from <code>' + esc(d.from) + '</code>' : '') + '</span>';
    tip.style.display = 'block';
    var r = tip.getBoundingClientRect();
    var left = Math.min(x + 14, window.innerWidth - r.width - 12), top = y + 16;
    if (top + r.height > window.innerHeight - 8) top = y - r.height - 12;
    tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
  }
  document.addEventListener('mouseover', function (ev) { var el = ev.target.closest && ev.target.closest('.hit'); if (el) showTip(el, ev.clientX, ev.clientY); });
  document.addEventListener('mousemove', function (ev) { if (tip.style.display === 'block') { var el = ev.target.closest && ev.target.closest('.hit'); if (el) showTip(el, ev.clientX, ev.clientY); } });
  document.addEventListener('mouseout', function (ev) { if (ev.target.closest && ev.target.closest('.hit')) tip.style.display = 'none'; });
  document.addEventListener('focusin', function (ev) { if (ev.target.classList && ev.target.classList.contains('hit')) { var r = ev.target.getBoundingClientRect(); showTip(ev.target, r.left + r.width / 2, r.top + r.height / 2); } });
  document.addEventListener('focusout', function (ev) { if (ev.target.classList && ev.target.classList.contains('hit')) tip.style.display = 'none'; });

  function start(saved) {
    if (saved && saved.q) state.q = saved.q;
    select((saved && saved.sel) || fromHash(), false);
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>
</body></html>
